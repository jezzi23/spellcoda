name: Release Workflow
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # the build server tags the data of a release in spellcoda-generated with the same tag
      - name: Checkout generated data of this release
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/spellcoda-generated
          ref: ${{ github.ref_name }}
          path: generated
          fetch-depth: 0

      # outside the working directory, everything in it goes into the zip
      - name: Write release notes
        run: |
          bash .github/release_notes.sh "${{ github.ref_name }}" . generated \
            "${{ github.repository }}" "${{ github.repository_owner }}/spellcoda-generated" \
            > "$RUNNER_TEMP/release_notes.md"
          cat "$RUNNER_TEMP/release_notes.md"

      - name: Prepare SpellCoda directory
        run: |
          shopt -s extglob
          mkdir -p topdir
          rm README.md
          mv !(topdir) topdir/
          mv topdir SpellCoda

      - name: Get tag name
        id: get_tag
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          # the checkout of generated/ leaves its .git in it, no git metadata ships
          find SpellCoda -name .git -prune -exec rm -rf {} +
          zip -r ${{ steps.get_tag.outputs.TAG_NAME }}.zip SpellCoda/
          if unzip -Z1 ${{ steps.get_tag.outputs.TAG_NAME }}.zip | grep -E '(^|/)\.git(/|$)'; then
            echo "ERROR: git metadata in the release archive"
            exit 1
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.get_tag.outputs.TAG_NAME }}
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          files: |
            ${{ steps.get_tag.outputs.TAG_NAME }}.zip

      - name: Notify Discord via Webhook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          bash .github/discord_release.sh "${{ steps.get_tag.outputs.TAG_NAME }}" "${{ github.repository }}" new
